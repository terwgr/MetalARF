[package]
name = "rw-s2s-energy"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[[bin]]
name = "rw_s2s_energy"
path = "src/main.rs"

[dependencies]
netcrust = { path = "../../vendor/netcrust" }
rw-store = { path = "../rw-store" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }
