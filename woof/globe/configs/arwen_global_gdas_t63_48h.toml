[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-gdas-t63-48h"
acknowledgement = "research-only-arwen-global-v1"
backend = "numpy"
precision = "float64"

[grid]
truncation = 63
dealias_factor = 1.5

[time]
dt_s = 300.0
duration_s = 172800.0
output_interval_s = 10800.0
maximum_cfl = 0.75
integrator = "imex_ssp3"

[vertical]
coordinate = "surface_stretched"
nlev = 40
p_top_pa = 100.0

# analysis_grib is relative to the working directory, in the shape the
# quickstart's fetch writes:
#   woof fetch --source gdas --cycle <YYYY-MM-DD>T18 --hours 0 \
#       --mode full-file --out data/gdas-analysis
# analysis_mapping is the packaged authority's BARE ID, not a path: the
# resolver globs rw-wps-<id>-*.mapping.json under gpuwm/authorities and
# requires exactly one match, so this spelling resolves from an installed
# wheel as well as from a checkout.
[initial]
mode = "analysis"
analysis_grib = "data/gdas-analysis/gdas.t18z.pgrb2.0p25.f000"
analysis_mapping = "gdas-global"
surface_water_kg_m2 = 500.0

[physics]
mode = "reference"

[diffusion]
enabled = true
order = 4
e_folding_time_s_at_truncation = 14400.0
preserve_degree = 1

[semi_implicit]
enabled = true
weight = 1.0

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 5.0e-11
transform_parseval_relative_error = 5.0e-12
mass_relative_drift = 1.0e-9
total_water_relative_drift = 1.0e-8
