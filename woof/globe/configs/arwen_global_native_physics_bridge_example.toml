[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-native-adapter-refusal-example"
acknowledgement = "research-only-arwen-global-v1"
backend = "numpy"
precision = "float64"

[grid]
truncation = 3
dealias_factor = 1.5

[time]
dt_s = 10.0
duration_s = 20.0
output_interval_s = 20.0
maximum_cfl = 0.90
integrator = "imex_ssp3"

[vertical]
coordinate = "pressure_blend"
nlev = 4
p_top_pa = 100.0

[initial]
surface_pressure_pa = 100000.0
surface_temperature_k = 286.0
top_temperature_k = 220.0
qv_surface = 0.006
zonal_wind_m_s = 2.0
perturbation_amplitude = 0.00001
zonal_wavenumber = 2
terrain_amplitude_m = 25.0
surface_water_kg_m2 = 500.0

[physics]
mode = "arwen-native"
native_adapter_name = "rrtmgp-morrison-ysu-noahmp-v1"
native_adapter_options = { mp_physics = 10, bl_pbl_physics = 1, sf_surface_physics = 4 }

[diffusion]
enabled = true
order = 4
e_folding_time_s_at_truncation = 21600.0
preserve_degree = 1
divergence_strength = 1.5
pressure_strength = 0.25
water_strength = 0.5

[semi_implicit]
enabled = true
external_wave_speed_m_s = 200.0
weight = 0.5

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 5.0e-11
transform_parseval_relative_error = 5.0e-12
mass_relative_drift = 1.0e-9
total_water_relative_drift = 1.0e-8
