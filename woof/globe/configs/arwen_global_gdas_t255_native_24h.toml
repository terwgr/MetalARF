# T255 L40, the whole native WOOF CUDA column suite, one forecast day from
# the archived GDAS 2026-08-30 18Z analysis: the T255 config of record and the
# door a bare run goes through.
#
# It names NO integrator and NO step on purpose.  A config that omits
# [time] integrator runs the shipped default core (config.SHIPPED_INTEGRATOR,
# the two-time-level semi-Lagrangian semi-implicit core "sl_si"), and one
# that omits dt_s under it takes that core's 300 s step (config.DEFAULT_
# SEMILAG_STEP_S), so a run of this file with no flag is the proof that the
# default is the default.  The semi-Lagrangian core became the default at
# every truncation on 2026-09-06 by the equal-cost grade on the observation
# scorecard (five rows better, four worse, nine level against the Eulerian
# core at the same card-time, the losing rows named on the door page) and a
# forecast day in about a quarter of the Eulerian wall.  The Eulerian core is
# selectable by name: `..._t255_native_imex_24h.toml` is this suite on
# `imex_ssp3` at its rule step of 90 s (config.default_eulerian_step_s), with
# its ten-step identity pinned in the changelog.
#
# Everything else this file leaves out reads the semi-Lagrangian core's own
# defaults, which are the values every graded arm ran at: [semi_implicit]
# off_centring_weight 0.55 (config.SEMILAG_OFF_CENTRING_WEIGHT), [time]
# maximum_lipschitz 0.75 (the trajectory-fold gate that refuses where the
# Eulerian CFL would), the six-point quintic gather with three trajectory
# iterations ([semilag] defaults), and the order 16 / 12 min hyperdiffusion
# (config.SEMILAG_DIFFUSION_*, set on the dry ladder of 2026-09-07).
[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-gdas-t255-native-24h"
acknowledgement = "research-only-arwen-global-v1"
backend = "cupy"
precision = "float32"

[grid]
truncation = 255
dealias_factor = 1.5

# 86400/300 = 288 whole steps; 10800/300 = 36-step output cadence.  The
# spectral CFL is measured and written into the receipt's `cfl` block as a
# reading (about 1.55 at 300 s on the 2026-09-01 00Z day); it is not a bound
# on this core, whose trajectories are gathered and not stepped, and the
# Lipschitz gate refuses instead where the trajectory map would fold.
[time]
duration_s = 86400.0
output_interval_s = 10800.0

[vertical]
coordinate = "surface_stretched"
nlev = 40
p_top_pa = 100.0

# analysis_mapping is the packaged authority's BARE ID, not a path: the
# resolver globs rw-wps-<id>-*.mapping.json under gpuwm/authorities and
# requires exactly one match, so this spelling resolves from an installed
# wheel as well as from a checkout root.
[initial]
mode = "analysis"
analysis_grib = "cases/gdas/gdas.t18z.pgrb2.0p25.f000"
analysis_mapping = "gdas-global"
surface_water_kg_m2 = 500.0

# start_time_utc matches the ingested GDAS cycle (2026-08-30 18Z per the
# case archive's fetch-manifest), so the RRTMGP solar geometry runs on the
# analysis instant.
# radiation_interval_s follows the regional radt convention of one minute
# per km of grid spacing: 52 km -> 52 min, taken as the whole multiple of
# the step nearest it, 10 x 300 s = 3000 s, so radiation buckets land exactly
# on model steps (both buckets are BUCKETED, not stepped, so a value that is
# not a whole multiple of the step would fire on a jittering effective
# interval).  (The regional
# auto-derive floor radt = max(1.0, dx_km) is a sub-km-nest trap and is
# nowhere near this operating point.)  land_surface_interval_s = dt runs
# Noah once per model step, as the regional model does; the step's two
# Strang physics calls share that land bucket, and land columns hand YSU
# Noah's fluxes on both of them (native_runtime _hold_land_fluxes).  dx_m
# feeds sfclay its grid-spacing-dependent branches at the T255 equatorial
# spacing, and the Grell-Freitas cumulus scheme its scale-aware closure:
# cumulus = "gf" is the adapter default (between YSU and Morrison, shallow
# arm on), so it is not repeated in the options mapping below.
[physics]
mode = "arwen-native"
native_adapter_name = "arwen-cuda-column-suite-v1"
native_adapter_options = { acknowledgement = "device-pending-arwen-native-physics-v1", start_time_utc = "2026-08-30T18:00:00Z", radiation = "rrtmgp", radiation_interval_s = 3000.0, radiation_column_chunk = 12500, radiation_validation_mode = "fused", surface_layer = "sfclay", sfclay_option = 1, land_surface = "noah", land_surface_interval_s = 300.0, pbl = "ysu", ysu_topdown_pblmix = 1, microphysics = "morrison", morr_rimed_ice = 1, dx_m = 52100.0 }

# Order 8 at 36 min (2026-09-04): the energy ledger read the truncation band
# fed by the resolved cascade faster than the order 4 / 4 h drain removed it
# (a flat tail at 0.22 to 0.27 of the observed 250 hPa spectrum).  This shape
# drains every degree above n = 0.79 T harder (1.4x at 0.82 T, 6.7x at the
# truncation) and 250 km six times less (config.DEFAULT_DIFFUSION_ORDER).
# This file names NO order and NO e-folding time: under the semi-Lagrangian
# core an omitted drain reads the core's own, order 16 at 720 s at the
# truncation (config.SEMILAG_DIFFUSION_ORDER / _EFOLD_S, set on the dry
# ladder of 2026-09-07), so this record is the door with nothing said.
[diffusion]
enabled = true
preserve_degree = 1

[semi_implicit]
enabled = true
weight = 1.0

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 1.0e-6
transform_parseval_relative_error = 5.0e-7
mass_relative_drift = 1.0e-4
total_water_relative_drift = 1.0e-3
# physics_water_repair gate, NATIVE-suite sizing (2026-09-01).  The
# precision-wide 5e-4 envelope (runner._FIXER_ABSORPTION_LIMITS) was
# measured on the reference suite, which has no kernel-internal closure
# channel; the native suite has two -- Morrison's rainncv credited 1:1 to
# the reservoir vs the actual column debit its fp32 process arithmetic
# applies, and the post-kernel negative-species clamp (tolerance 1e-7 per
# level-species; the creation ceiling is order 3e-3 kg/m2 at 20 levels and
# the same order at 40, the column mass being the same) --
# both genuine fp32 accumulation, NOT booking routes: the CPU repro
# (water-repair-262, 2026-09-01, real model.step with verbatim-noah water
# arithmetic, 217,800 column-calls of drip/melt/partition/evap/dew/qfx
# forcing) put every booking route at <= 2 x 2^-14 = 1.22e-4 kg/m2, the
# same ledger-summation floor the reference suite reads (~1e-4).
# Measurement: day 1 of this config on the RTX 5090 (GDAS 2026-08-30 18Z,
# 1440 steps) read max repair 0.00262451171875 kg/m2 = exactly 43 x 2^-14,
# the fp32 quantum of the worst column's [512,1024) kg/m2 ledger total.
# Sizing: 4 x that measured max = 0.010498046875 = 43 x 2^-12, which
# admits the same 43-quantum excursion class on column totals up to the
# 4096 kg/m2 binade (the convicted-era worst columns totalled ~1150,
# where the class reads 5.25e-3) while staying 100x below the smallest
# booking-route conviction at run scale (1.0943603515625, precip
# double-entry, fixed 7d7b528d0) and 1e5 below the runoff-store
# conviction (1072, fixed 89571245d) -- the unbooked-route breakage this
# gate exists to catch.  Reference configs keep the 5e-4 envelope.
physics_water_repair_max_step_kg_m2 = 0.010498046875
