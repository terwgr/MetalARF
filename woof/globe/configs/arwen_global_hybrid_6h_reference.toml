[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-hybrid-reference-six-hour"
acknowledgement = "research-only-arwen-global-v1"
backend = "numpy"
precision = "float64"

[grid]
truncation = 7
dealias_factor = 1.5

[time]
dt_s = 60.0
duration_s = 21600.0
output_interval_s = 3600.0
maximum_cfl = 0.75
integrator = "ssprk3"

[vertical]
coordinate = "pressure_blend"
nlev = 8
p_top_pa = 100.0

[initial]
surface_pressure_pa = 100000.0
surface_temperature_k = 288.0
top_temperature_k = 215.0
qv_surface = 0.010
zonal_wind_m_s = 8.0
perturbation_amplitude = 0.0001
zonal_wavenumber = 3
terrain_amplitude_m = 500.0
surface_water_kg_m2 = 500.0

[physics]
mode = "reference"

[reference_physics]
radiation = true
surface_fluxes = true
turbulence = true
convection = true
saturation_adjustment = true
microphysics = true

[diffusion]
enabled = true
order = 4
e_folding_time_s_at_truncation = 21600.0
preserve_degree = 1
divergence_strength = 1.5
pressure_strength = 0.25
water_strength = 0.5

[semi_implicit]
enabled = true
external_wave_speed_m_s = 300.0
weight = 1.0

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 5.0e-11
transform_parseval_relative_error = 5.0e-12
mass_relative_drift = 1.0e-9
total_water_relative_drift = 1.0e-8
