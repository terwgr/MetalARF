# T533 L40, the whole native suite on the Eulerian core (`imex_ssp3`),
# selectable by name: the T533 config of record
# (`..._t533_native_24h.toml`) runs the shipped default core, the
# semi-Lagrangian one at 300 s; this file is the same grid, case and suite
# on the Eulerian pair at its rule step of 40 s
# (config.default_eulerian_step_s: the largest whole step keeping the
# strongest analysis day on disk, 141.3 m/s implied at T533, at or under
# 0.70 of the 0.75 CFL gate; 45 s would need that day under 139.3 m/s).
# The order 4 / 4 h diffusion is the T533 Eulerian tuning this file has
# always carried.
[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-gdas-t533-native-imex-24h"
acknowledgement = "research-only-arwen-global-v1"
backend = "cupy"
precision = "float32"

[grid]
truncation = 533
dealias_factor = 1.5

# The step is the rule's (config.default_eulerian_step_s), not a number
# typed here.  The runner's gate is the spectral CFL dt |V|max sqrt(N(N+1))/a
# against maximum_cfl; at semi_implicit weight 1.0 the external wave is
# Crank-Nicolson-neutral and only the wind counts.  The shipped step is the
# largest multiple of 5 s dividing the hour whose CFL on the STRONGEST
# analysis day on disk stays at or under 0.70 of the gate.  MEASURED
# 2026-09-06 (tools/arwen_global_cfl_sweep.py): nine GDAS analyses at T255
# over whole forecast days, the day maximum being the analysis's own jet at
# step 1 on every one, the strongest 2026-08-31 00Z; at T533 the same wind
# reads 1.0327 times the T255 value on the shared day (0.3486 at 30 s on
# 2026-09-01 00Z against 0.5389 at 100 s at T255), which puts the strongest
# day at 141.3 m/s implied and admits 44 s at the rule, so 40 s: 0.473 of
# the gate on the strongest day, 63 percent.  45 s would need the strongest
# day under 139.3 m/s and it is not.  The 25 s this config shipped with
# until 2026-09-06 was set against a day-2 jet of an earlier tree (225 m/s
# implied) that no current day reproduces; a stronger day refuses 40 s by
# name and the receipt's `cfl` block says which step it would have
# admitted.  (T533 at dealias 1.5 quadrature is 1602 x 801: grid spacing
# 2*pi*6371.22 km / 1602 = 25.0 km at the equator.)
# 86400/40 = 2160 whole steps; 3600/40 = 90-step output cadence, one
# checkpoint per hour so the scoring chain of record reads the day.
[time]
dt_s = 40.0
duration_s = 86400.0
output_interval_s = 3600.0
maximum_cfl = 0.75
integrator = "imex_ssp3"

[vertical]
coordinate = "surface_stretched"
nlev = 40
p_top_pa = 100.0

# analysis_mapping is the packaged authority's BARE ID, not a path: the
# resolver globs rw-wps-<id>-*.mapping.json under gpuwm/authorities and
# requires exactly one match, so this spelling resolves from an installed
# wheel as well as from a checkout root.
[initial]
mode = "analysis"
analysis_grib = "cases/gdas/gdas.t18z.pgrb2.0p25.f000"
analysis_mapping = "gdas-global"
surface_water_kg_m2 = 500.0

# start_time_utc matches the ingested GDAS cycle (2026-08-30 18Z per the
# case archive's fetch-manifest), so the RRTMGP solar geometry runs on the
# analysis instant.
# radiation_interval_s follows the regional radt convention of one minute
# per km of grid spacing: 25 km -> 25 min, taken as the whole multiple of
# the step nearest it, 38 x 40 s = 1520 s, so radiation buckets land exactly
# on model steps.  (The regional
# auto-derive floor radt = max(1.0, dx_km) is a sub-km-nest trap and is
# nowhere near this operating point.)  land_surface_interval_s = dt runs
# Noah once per model step, as the regional model does; the step's two
# Strang physics calls share that land bucket, and land columns hand YSU
# Noah's fluxes on both of them (native_runtime _hold_land_fluxes).  dx_m
# feeds sfclay its grid-spacing-dependent branches at the T533 equatorial
# spacing, and the Grell-Freitas cumulus scheme its scale-aware closure:
# radiation_column_chunk = 5000 keeps the RRTMGP chunk workspace
# inside the 25 km device budget (the T255 default is 12,500); cumulus = "gf" is the adapter default (between YSU and Morrison, shallow
# arm on), so it is not repeated in the options mapping below.
[physics]
mode = "arwen-native"
native_adapter_name = "arwen-cuda-column-suite-v1"
native_adapter_options = { acknowledgement = "device-pending-arwen-native-physics-v1", start_time_utc = "2026-08-30T18:00:00Z", radiation = "rrtmgp", radiation_interval_s = 1520.0, radiation_column_chunk = 5000, radiation_validation_mode = "fused", surface_layer = "sfclay", sfclay_option = 1, land_surface = "noah", land_surface_interval_s = 40.0, pbl = "ysu", ysu_topdown_pblmix = 1, microphysics = "morrison", morr_rimed_ice = 1, dx_m = 25000.0 }

[diffusion]
enabled = true
order = 4
e_folding_time_s_at_truncation = 14400.0
preserve_degree = 1

[semi_implicit]
enabled = true
weight = 1.0

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 1.0e-6
transform_parseval_relative_error = 5.0e-7
mass_relative_drift = 1.0e-4
total_water_relative_drift = 1.0e-3
# physics_water_repair gate, NATIVE-suite sizing (2026-09-01).  The
# precision-wide 5e-4 envelope (runner._FIXER_ABSORPTION_LIMITS) was
# measured on the reference suite, which has no kernel-internal closure
# channel; the native suite has two -- Morrison's rainncv credited 1:1 to
# the reservoir vs the actual column debit its fp32 process arithmetic
# applies, and the post-kernel negative-species clamp (tolerance 1e-7 per
# level-species; the creation ceiling is order 3e-3 kg/m2 at 20 levels and
# the same order at 40, the column mass being the same) --
# both genuine fp32 accumulation, NOT booking routes: the CPU repro
# (water-repair-262, 2026-09-01, real model.step with verbatim-noah water
# arithmetic, 217,800 column-calls of drip/melt/partition/evap/dew/qfx
# forcing) put every booking route at <= 2 x 2^-14 = 1.22e-4 kg/m2, the
# same ledger-summation floor the reference suite reads (~1e-4).
# Measurement: day 1 of this config on the RTX 5090 (GDAS 2026-08-30 18Z,
# 1440 steps) read max repair 0.00262451171875 kg/m2 = exactly 43 x 2^-14,
# the fp32 quantum of the worst column's [512,1024) kg/m2 ledger total.
# Sizing: 4 x that measured max = 0.010498046875 = 43 x 2^-12, which
# admits the same 43-quantum excursion class on column totals up to the
# 4096 kg/m2 binade (the convicted-era worst columns totalled ~1150,
# where the class reads 5.25e-3) while staying 100x below the smallest
# booking-route conviction at run scale (1.0943603515625, precip
# double-entry, fixed 7d7b528d0) and 1e5 below the runoff-store
# conviction (1072, fixed 89571245d) -- the unbooked-route breakage this
# gate exists to catch.  Reference configs keep the 5e-4 envelope.
physics_water_repair_max_step_kg_m2 = 0.010498046875
