# T255 L40, the full native suite on the semi-Lagrangian core, one forecast day
# from the GDAS 2026-09-01 00Z analysis at dt = 300 s, off-centring weight
# alpha = 0.50: rung of the alpha sub-ladder.
#
# alpha weights the ARRIVAL point on the semi-implicit linear operator and
# 1 - alpha the departure point; the solve refuses anything below 0.5, where
# the map stops being unconditionally neutral.  The sub-ladder is 0.50, 0.53,
# 0.55 (the arm of record) and 0.60, everything else held: the same case, the
# same suite, the same statics, the same step and the same physics buckets.
#
# It exists because the two readings that set 0.55 point in opposite
# directions.  On the Eulerian core the tree measured 0.55 costing 1.7 percent
# of the rotational kinetic energy per 24 h at T42 with the water and
# angular-momentum drift up seventy-fold, and measured it removing the Doppler
# growth that 0.50 leaves.  A semi-Lagrangian scheme at a horizontal Courant
# number above one is exposed to orographic resonance where a centred scheme
# is worst, which pushes the other way.  Which value ships is a scorecard
# question, so the rungs are scored and not argued.
#
# output_interval_s is the whole duration: this ladder is read at 24 h, at the
# 00Z stations and the 00Z soundings, because a T255 checkpoint is 385 MiB and
# four rungs at the full cadence is a disk this lane does not have.
[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-gdas-t255-native-sl-si-24h-alpha050"
acknowledgement = "research-only-arwen-global-v1"
backend = "cupy"
precision = "float32"

[grid]
truncation = 255
dealias_factor = 1.5

# The step is NOT bound by the advective Courant number on this core; the
# Lipschitz gate below is the refusal that replaces it.
[time]
dt_s = 300.0
duration_s = 86400.0
output_interval_s = 86400.0
integrator = "sl_si"
maximum_lipschitz = 0.75

[semilag]
quasi_monotone = true
trajectory_iterations = 3

[vertical]
coordinate = "surface_stretched"
nlev = 40
p_top_pa = 100.0

# analysis_mapping is the packaged authority's BARE ID, not a path: the
# resolver globs rw-wps-<id>-*.mapping.json under gpuwm/authorities and
# requires exactly one match, so this spelling resolves from an installed
# wheel as well as from a checkout root.
[initial]
mode = "analysis"
analysis_grib = "cases/baseline-2026090100/gdas.t00z.pgrb2.0p25.f000"
analysis_mapping = "gdas-global"
surface_water_kg_m2 = 500.0

# start_time_utc matches the ingested GDAS cycle (2026-09-01 00Z, the
# baseline case the scorecard chain reads), so the RRTMGP solar geometry
# runs on the analysis instant.
# radiation_interval_s follows the regional radt convention of one minute
# per km of grid spacing: 52 km -> 52 min = 3120 s = 52 whole 60 s steps,
# so radiation buckets land exactly on model steps.  (The regional
# auto-derive floor radt = max(1.0, dx_km) is a sub-km-nest trap and is
# nowhere near this operating point.)  land_surface_interval_s = dt runs
# Noah once per model step, as the regional model does; the step's two
# Strang physics calls share that land bucket, and land columns hand YSU
# Noah's fluxes on both of them (native_runtime _hold_land_fluxes).  dx_m
# feeds sfclay its grid-spacing-dependent branches at the T255 equatorial
# spacing, and the Grell-Freitas cumulus scheme its scale-aware closure:
# cumulus = "gf" is the adapter default (between YSU and Morrison, shallow
# arm on), so it is not repeated in the options mapping below.
[physics]
mode = "arwen-native"
native_adapter_name = "arwen-cuda-column-suite-v1"
native_adapter_options = { acknowledgement = "device-pending-arwen-native-physics-v1", start_time_utc = "2026-09-01T00:00:00Z", radiation = "rrtmgp", radiation_interval_s = 3000.0, radiation_column_chunk = 12500, radiation_validation_mode = "fused", surface_layer = "sfclay", sfclay_option = 1, land_surface = "noah", land_surface_interval_s = 300.0, pbl = "ysu", ysu_topdown_pblmix = 1, microphysics = "morrison", morr_rimed_ice = 1, dx_m = 52100.0 }

# The semi-Lagrangian core's own drain (config.SEMILAG_DIFFUSION_ORDER,
# MEASURED 2026-09-07 on the dry T255 ladder): order 16 at 12 min at the
# truncation on the six-point gather keeps 0.973 / 0.915 / 1.025 / 0.965 of
# the Eulerian core's 500 hPa vorticity power at n = 61-120 / 121-180 /
# 181-230 / 231-255, where the cubic gather at order 8 and 36 min kept
# 0.835 / 0.576 / 0.474 / 0.502.
[diffusion]
enabled = true
order = 16
e_folding_time_s_at_truncation = 720.0
preserve_degree = 1

[semi_implicit]
enabled = true
weight = 1.0
off_centring_weight = 0.50

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 1.0e-6
transform_parseval_relative_error = 5.0e-7
mass_relative_drift = 1.0e-4
total_water_relative_drift = 1.0e-3
# physics_water_repair gate, NATIVE-suite sizing (2026-09-01).  The
# precision-wide 5e-4 envelope (runner._FIXER_ABSORPTION_LIMITS) was
# measured on the reference suite, which has no kernel-internal closure
# channel; the native suite has two -- Morrison's rainncv credited 1:1 to
# the reservoir vs the actual column debit its fp32 process arithmetic
# applies, and the post-kernel negative-species clamp (tolerance 1e-7 per
# level-species; the creation ceiling is order 3e-3 kg/m2 at 20 levels and
# the same order at 40, the column mass being the same) --
# both genuine fp32 accumulation, NOT booking routes: the CPU repro
# (water-repair-262, 2026-09-01, real model.step with verbatim-noah water
# arithmetic, 217,800 column-calls of drip/melt/partition/evap/dew/qfx
# forcing) put every booking route at <= 2 x 2^-14 = 1.22e-4 kg/m2, the
# same ledger-summation floor the reference suite reads (~1e-4).
# Measurement: day 1 of this config on the RTX 5090 (GDAS 2026-08-30 18Z,
# 1440 steps) read max repair 0.00262451171875 kg/m2 = exactly 43 x 2^-14,
# the fp32 quantum of the worst column's [512,1024) kg/m2 ledger total.
# Sizing: 4 x that measured max = 0.010498046875 = 43 x 2^-12, which
# admits the same 43-quantum excursion class on column totals up to the
# 4096 kg/m2 binade (the convicted-era worst columns totalled ~1150,
# where the class reads 5.25e-3) while staying 100x below the smallest
# booking-route conviction at run scale (1.0943603515625, precip
# double-entry, fixed 7d7b528d0) and 1e5 below the runoff-store
# conviction (1072, fixed 89571245d) -- the unbooked-route breakage this
# gate exists to catch.  Reference configs keep the 5e-4 envelope.
physics_water_repair_max_step_kg_m2 = 0.010498046875
