[arwen_global]
schema = "gpuwm.arwen-global-run/v1"
name = "arwen-global-level5-native-t3-smoke"
acknowledgement = "research-only-arwen-global-v1"
backend = "cupy"
precision = "float32"

[grid]
truncation = 3
dealias_factor = 1.5

[time]
dt_s = 10.0
duration_s = 40.0
output_interval_s = 20.0
maximum_cfl = 0.90
integrator = "ssprk3"

[vertical]
coordinate = "pressure_blend"
nlev = 5
p_top_pa = 100.0

[initial]
surface_pressure_pa = 100000.0
surface_temperature_k = 286.0
top_temperature_k = 220.0
qv_surface = 0.006
zonal_wind_m_s = 2.0
perturbation_amplitude = 0.00001
zonal_wavenumber = 2
terrain_amplitude_m = 25.0
surface_water_kg_m2 = 500.0

[physics]
mode = "arwen-native"
native_adapter_name = "arwen-cuda-column-suite-v1"
native_adapter_options = { acknowledgement = "device-pending-arwen-native-physics-v1", start_time_utc = "2024-05-21T00:00:00Z", radiation = "rrtmgp", radiation_interval_s = 10.0, radiation_column_chunk = 512, radiation_validation_mode = "fused", surface_layer = "sfclay", sfclay_option = 1, land_surface = "noah", land_surface_interval_s = 10.0, pbl = "ysu", ysu_topdown_pblmix = 1, microphysics = "morrison", morr_rimed_ice = 1, dx_m = 50000.0 }

[diffusion]
enabled = true
order = 4
e_folding_time_s_at_truncation = 21600.0
preserve_degree = 1
divergence_strength = 1.5
pressure_strength = 0.25
water_strength = 0.5
moment_strength = 0.75

[semi_implicit]
enabled = true
external_wave_speed_m_s = 200.0
weight = 0.5

[repair]
mass_fixer = true
water_fixer = true
positivity_repair = true

[gates]
transform_roundtrip_relative_linf = 5.0e-5
transform_parseval_relative_error = 5.0e-5
mass_relative_drift = 1.0e-7
total_water_relative_drift = 1.0e-6
# NATIVE-suite physics_water_repair sizing, same value and derivation as
# arwen_global_gdas_t255_native_24h.toml: this smoke runs the same
# arwen-cuda-column-suite whose kernel-internal fp32 channels (Morrison
# rainncv-vs-column-debit closure, negative-species clamp) the
# reference-derived 5e-4 envelope was never sized for.  Measured day-1
# T255 max repair 0.00262451171875 kg/m2 = 43 x 2^-14; limit = 4x =
# 0.010498046875 = 43 x 2^-12, still 100x under the smallest convicted
# booking route at run scale (1.0943603515625, fixed 7d7b528d0).
physics_water_repair_max_step_kg_m2 = 0.010498046875
